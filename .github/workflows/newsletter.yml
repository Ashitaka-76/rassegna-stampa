name: Invia Newsletter Giornaliera

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC = 08:00 CET (inverno) / 09:00 CEST (estate)
  workflow_dispatch:        # lancio manuale dalla UI di GitHub (utile per test)

permissions:
  contents: read            # solo lettura del repo — nessun push

jobs:
  newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Invia newsletter
        env:
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NEWSLETTER_TO: ${{ secrets.NEWSLETTER_TO }}
        run: python newsletter.py
